<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Score Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d1a;--surface:#0e1628;--surface2:#141e35;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);--blue:#4d7cfe;--green:#10b981;--green-dim:rgba(16,185,129,0.12);--red:#ef4444;--red-dim:rgba(239,68,68,0.12);--text:#f1f5f9;--muted:#64748b;--muted2:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);min-height:100vh;color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}
.screen{display:none;width:100%}
.screen.active{display:flex}
#selectScreen{align-items:center;justify-content:center;min-height:100vh}
.select-wrap{width:100%;max-width:380px}
.select-logo{text-align:center;margin-bottom:40px}
.logo-mark{width:60px;height:60px;background:linear-gradient(135deg,var(--blue),#7c3aed);border-radius:18px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;margin-bottom:16px}
.select-logo h1{font-size:24px;font-weight:800;letter-spacing:-0.8px}
.select-logo p{font-size:14px;color:var(--muted2);margin-top:6px}
.select-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);text-align:center;margin-bottom:16px}
.player-btns{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.player-btn{width:100%;padding:18px 20px;background:var(--surface);border:1px solid var(--border);border-radius:16px;cursor:pointer;touch-action:manipulation;transition:all .18s;display:flex;align-items:center;gap:16px;font-family:inherit;text-align:left;color:var(--text)}
.player-btn:hover{border-color:var(--border2);background:var(--surface2);transform:translateY(-2px)}
.player-btn:active{transform:translateY(0)}
.p-avatar{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0}
.player-btn.eron .p-avatar{background:var(--green-dim);color:var(--green)}
.player-btn.lawin .p-avatar{background:var(--red-dim);color:var(--red)}
.player-btn.guest .p-avatar{background:rgba(100,116,139,.12);color:var(--muted2)}
.p-info{flex:1}
.p-name{font-size:16px;font-weight:700}
.p-sub{font-size:12px;color:var(--muted2);margin-top:3px}
.p-arrow{font-size:18px;color:var(--muted)}
#dashScreen{flex-direction:column;min-height:100vh;max-width:520px;margin:0 auto;width:100%}
.dash-header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 20px}
.brand{font-size:18px;font-weight:700}
.brand span{color:var(--blue)}
.header-right{display:flex;align-items:center;gap:10px}
.badge-mode{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.badge-guest{background:rgba(100,116,139,.15);color:#94a3b8;border:1px solid rgba(100,116,139,.25)}
.badge-eron{background:var(--green-dim);color:#6ee7b7;border:1px solid rgba(16,185,129,.25)}
.badge-lawin{background:var(--red-dim);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
.btn-back{background:var(--surface);border:1px solid var(--border);color:var(--muted2);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.chart-card,.score-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:16px}
.chart-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted2);margin-bottom:16px}
.bar-chart{display:flex;align-items:flex-end;gap:16px;height:100px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px}
.bar-val{font-size:12px;font-weight:600;color:var(--muted2)}
.bar-fill{width:100%;border-radius:8px 8px 0 0;min-height:4px;transition:height .5s cubic-bezier(.34,1.56,.64,1)}
.bar-fill.eron{background:linear-gradient(180deg,#10b981,#059669)}
.bar-fill.lawin{background:linear-gradient(180deg,#ef4444,#dc2626)}
.bar-name{font-size:12px;font-weight:600;color:var(--muted2)}
.card-top{display:flex;align-items:center;justify-content:space-between}
.user-info{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.avatar.eron{background:var(--green-dim);color:var(--green)}
.avatar.lawin{background:var(--red-dim);color:var(--red)}
.user-name-tag{font-size:16px;font-weight:700}
.score-status{font-size:12px;color:var(--muted2);margin-top:2px}
.score-display{text-align:right}
.score-big{font-size:52px;font-weight:900;letter-spacing:-2px;line-height:1}
.score-big.eron{color:var(--green)}
.score-big.lawin{color:var(--red)}
.score-sub{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.card-controls{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.ctrl-btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;touch-action:manipulation;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.ctrl-btn:active{transform:scale(.95)}
.ctrl-label{font-size:13px;font-weight:600}
.ctrl-plus{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,185,129,.2)}
.ctrl-minus{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.history-toggle{width:100%;background:none;border:none;color:var(--muted2);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;margin-top:14px;padding:0}
.history-list{margin-top:12px;max-height:180px;overflow-y:auto;display:none}
.history-list.open{display:block}
.hist-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.hist-row:last-child{border-bottom:none}
.hist-score{font-weight:700;width:28px}
.hist-time{color:var(--muted2);flex:1;margin-left:10px}
.dash-footer{padding:8px 0 28px;text-align:center}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;border:1px solid var(--border2);color:var(--text);padding:10px 22px;border-radius:30px;font-size:13px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="selectScreen" class="screen active">
  <div class="select-wrap">
    <div class="select-logo">
      <div class="logo-mark">S</div>
      <h1>Score Board</h1>
      <p>Tap your name to continue</p>
    </div>
    <p class="select-label">Who are you?</p>
    <div class="player-btns">
      <button class="player-btn eron" onclick="enter('ERON')">
        <div class="p-avatar">ER</div>
        <div class="p-info"><div class="p-name">ERON</div><div class="p-sub">Tap to manage your score</div></div>
        <span class="p-arrow">→</span>
      </button>
      <button class="player-btn lawin" onclick="enter('LAWIN')">
        <div class="p-avatar">LA</div>
        <div class="p-info"><div class="p-name">LAWIN</div><div class="p-sub">Tap to manage your score</div></div>
        <span class="p-arrow">→</span>
      </button>
      <button class="player-btn guest" onclick="enter('GUEST')">
        <div class="p-avatar">👀</div>
        <div class="p-info"><div class="p-name">Guest</div><div class="p-sub">View only — no editing</div></div>
        <span class="p-arrow">→</span>
      </button>
    </div>
  </div>
</div>

<div id="dashScreen" class="screen">
  <div class="dash-header">
    <div class="brand">Score<span>.</span></div>
    <div class="header-right">
      <span class="badge-mode" id="modeBadge"></span>
      <button class="btn-back" onclick="location.reload()">← Back</button>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-label">Score comparison</div>
    <div class="bar-chart">
      <div class="bar-col">
        <div class="bar-val" id="barValEron">0</div>
        <div class="bar-fill eron" id="barEron" style="height:4px"></div>
        <div class="bar-name">ERON</div>
      </div>
      <div class="bar-col">
        <div class="bar-val" id="barValLawin">0</div>
        <div class="bar-fill lawin" id="barLawin" style="height:4px"></div>
        <div class="bar-name">LAWIN</div>
      </div>
    </div>
  </div>

  <div class="score-card">
    <div class="card-top">
      <div class="user-info">
        <div class="avatar eron">ER</div>
        <div><div class="user-name-tag">ERON</div><div class="score-status" id="statusERON">Loading…</div></div>
      </div>
      <div class="score-display"><div class="score-big eron" id="scoreERON">—</div><div class="score-sub">points</div></div>
    </div>
    <div class="card-controls" id="ctrlERON" style="display:none">
      <button class="ctrl-btn ctrl-plus" id="plusERON"><span>+</span><span class="ctrl-label">Add point</span></button>
      <button class="ctrl-btn ctrl-minus" id="minusERON"><span>−</span><span class="ctrl-label">Remove</span></button>
    </div>
    <button class="history-toggle" id="histTogERON"><span class="arrow">▾</span><span class="txt">Show history</span></button>
    <div class="history-list" id="histListERON"></div>
  </div>

  <div class="score-card">
    <div class="card-top">
      <div class="user-info">
        <div class="avatar lawin">LA</div>
        <div><div class="user-name-tag">LAWIN</div><div class="score-status" id="statusLAWIN">Loading…</div></div>
      </div>
      <div class="score-display"><div class="score-big lawin" id="scoreLAWIN">—</div><div class="score-sub">points</div></div>
    </div>
    <div class="card-controls" id="ctrlLAWIN" style="display:none">
      <button class="ctrl-btn ctrl-plus" id="plusLAWIN"><span>+</span><span class="ctrl-label">Add point</span></button>
      <button class="ctrl-btn ctrl-minus" id="minusLAWIN"><span>−</span><span class="ctrl-label">Remove</span></button>
    </div>
    <button class="history-toggle" id="histTogLAWIN"><span class="arrow">▾</span><span class="txt">Show history</span></button>
    <div class="history-list" id="histListLAWIN"></div>
  </div>

  <div class="dash-footer"><span style="font-size:12px;color:var(--muted)">Live sync via Firebase</span></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCfVDdwgkMkhdd-1TIQJbd3M_UWvNZQw8k",
  authDomain: "score-dashboard-304f0.firebaseapp.com",
  projectId: "score-dashboard-304f0"
});
const db = getFirestore(app);

let busy = false;
let started = false;
const scores = { ERON: 0, LAWIN: 0 };
const histories = { ERON: [], LAWIN: [] };

function now() {
  return new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

window.enter = function (user) {
  if (started) return;
  started = true;

  document.getElementById('selectScreen').classList.remove('active');
  const dash = document.getElementById('dashScreen');
  dash.classList.add('active');
  dash.style.display = 'flex';

  const badge = document.getElementById('modeBadge');
  if (user === 'ERON') { badge.textContent = 'ERON'; badge.className = 'badge-mode badge-eron'; }
  else if (user === 'LAWIN') { badge.textContent = 'LAWIN'; badge.className = 'badge-mode badge-lawin'; }
  else { badge.textContent = 'Guest'; badge.className = 'badge-mode badge-guest'; }

  if (user === 'ERON') document.getElementById('ctrlERON').style.display = 'flex';
  if (user === 'LAWIN') document.getElementById('ctrlLAWIN').style.display = 'flex';

  document.getElementById('plusERON').addEventListener('click', () => change('ERON', 1));
  document.getElementById('minusERON').addEventListener('click', () => change('ERON', -1));
  document.getElementById('plusLAWIN').addEventListener('click', () => change('LAWIN', 1));
  document.getElementById('minusLAWIN').addEventListener('click', () => change('LAWIN', -1));

  ['ERON', 'LAWIN'].forEach(u => {
    const btn = document.getElementById('histTog' + u);
    btn.addEventListener('click', () => {
      const open = document.getElementById('histList' + u).classList.toggle('open');
      btn.querySelector('.arrow').textContent = open ? '▴' : '▾';
      btn.querySelector('.txt').textContent = (open ? ' Hide' : ' Show') + ' history';
    });
  });

  // Real-time listeners (with error handling)
  ['ERON', 'LAWIN'].forEach(u => {
    onSnapshot(
      doc(db, 'scores', u),
      snap => {
        if (snap.exists()) {
          scores[u] = snap.data().value || 0;
          histories[u] = snap.data().history || [];
        } else {
          // Document missing: just show 0 locally. Do NOT overwrite anything in the database.
          scores[u] = 0;
          histories[u] = [];
        }
        updateCard(u);
        updateChart();
      },
      err => {
        console.error(u, err);
        document.getElementById('status' + u).textContent = 'Error: ' + err.code;
        document.getElementById('score' + u).textContent = '!';
        showToast('Cannot read data: ' + err.code);
      }
    );
  });
};

async function change(user, val) {
  if (busy) return;
  busy = true;
  try {
    const ref = doc(db, 'scores', user);
    const result = await runTransaction(db, async tx => {
      const snap = await tx.get(ref);
      let cur = snap.exists() ? (snap.data().value || 0) : 0;
      let hist = snap.exists() ? (snap.data().history || []) : [];
      if (val === 1) {
        cur++;
        hist.push({ v: cur, t: now() });
      } else if (val === -1 && cur > 0) {
        cur--;
        if (hist.length) hist.pop();
      }
      tx.set(ref, { value: cur, history: hist });
      return cur;
    });
    showToast(val === 1 ? `+1 — ${user} now has ${result}` : `${user} now has ${result}`);
  } catch (e) {
    console.error(e);
    showToast('Error: ' + (e.code || 'try again'));
  }
  busy = false;
}

function updateCard(u) {
  const s = scores[u];
  document.getElementById('score' + u).textContent = s;
  document.getElementById('status' + u).textContent =
    s === 0 ? 'No points yet' : `${s} point${s !== 1 ? 's' : ''} total`;

  const list = document.getElementById('histList' + u);
  const color = u === 'ERON' ? 'var(--green)' : 'var(--red)';
  list.innerHTML = histories[u].length === 0
    ? '<div style="font-size:13px;color:var(--muted);padding:10px 0">No history yet</div>'
    : [...histories[u]].reverse().map(h =>
        `<div class="hist-row"><span class="hist-score" style="color:${color}">${h.v}</span><span class="hist-time">${h.t}</span></div>`
      ).join('');
}

function updateChart() {
  const max = Math.max(scores.ERON, scores.LAWIN, 1);
  const h = 88;
  document.getElementById('barEron').style.height = Math.max(4, (scores.ERON / max) * h) + 'px';
  document.getElementById('barLawin').style.height = Math.max(4, (scores.LAWIN / max) * h) + 'px';
  document.getElementById('barValEron').textContent = scores.ERON;
  document.getElementById('barValLawin').textContent = scores.LAWIN;
}
</script>
</body>
</html>
